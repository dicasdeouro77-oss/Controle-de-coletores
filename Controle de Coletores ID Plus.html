<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Coletores ID Plus</title>
<style>
:root{--g:#0b7a3b;--g2:#e7f4ec;--y:#f7b500;--r:#d32f2f;--bg:#f5f8f5;--card:#fff;--tx:#18241c;--mu:#5b6b60;--bd:#dce6df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#3fbf72;--g2:#16301f;--bg:#0f1511;--card:#18211b;--tx:#e8f0ea;--mu:#9bb0a1;--bd:#2a382e}}
:root[data-theme="dark"]{--g:#3fbf72;--g2:#16301f;--bg:#0f1511;--card:#18211b;--tx:#e8f0ea;--mu:#9bb0a1;--bd:#2a382e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--g);color:#fff;padding:18px 16px;border-bottom:4px solid var(--y)}
header h1{margin:0;font-size:1.4rem}header p{margin:2px 0 0;opacity:.9}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:20px;font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--g2);color:var(--g)}
main{max-width:1100px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat b{display:block;font-size:1.8rem;color:var(--g)}.stat.r b{color:var(--r)}.stat.y b{color:#c98f00}.stat span{color:var(--mu);font-size:.85rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn{border:0;border-radius:14px;padding:16px;font-size:1.05rem;font-weight:800;cursor:pointer;background:var(--g);color:#fff;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.y{background:var(--y);color:#222}.btn.s{padding:8px 12px;font-size:.85rem;border-radius:10px}.btn.o{background:none;color:var(--g);border:2px solid var(--g)}.btn.d{background:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.col{background:var(--card);border:2px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;animation:in .3s}
.col.uso{border-color:var(--y)}.col.late{border-color:var(--r);animation:pulse 1.6s infinite}.col.off{opacity:.5}
.col img{width:100%;height:150px;object-fit:contain;background:#eef2ef;display:block}
.ci{padding:12px;display:grid;gap:4px}.mu,small{color:var(--mu)}
.tag{font-size:.78rem;font-weight:800;padding:4px 8px;border-radius:8px;justify-self:start}
.tag.disp{background:#d9f2e2;color:#0b6b33}.tag.uso{background:#fff0bf;color:#7a5800}.tag.late{background:#fde0e0;color:#a31515}
.timer{font-variant-numeric:tabular-nums;font-weight:700}.warn{color:var(--r);font-weight:800}
@keyframes in{from{opacity:0;transform:translateY(6px)}}@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(211,47,47,.2)}}
section{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.1rem}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu)}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.fl input,.fl select{width:auto;flex:1;min-width:130px}
label{display:block;margin:10px 0;font-weight:600;font-size:.9rem}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.on{display:flex}.box{background:var(--card);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px;animation:in .25s}
@media(min-width:600px){#m{align-items:center}.box{border-radius:20px}}
.pv{display:flex;gap:10px;align-items:center;margin-bottom:6px}.pv img{width:70px;height:70px;object-fit:contain;background:#eef2ef;border-radius:10px}
.ok{text-align:center}.ok h2{color:var(--g);font-size:1.3rem}
.bn{background:#fff0bf;color:#5a4300;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.nt{padding:8px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}.nt.u{font-weight:700}
.badge{background:var(--r);color:#fff;border-radius:10px;padding:1px 7px;font-size:.75rem;margin-left:4px}
footer{text-align:center;color:var(--mu);font-size:.75rem;padding:18px 12px 30px}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:30}
</style></head><body>

   const u={devolucao_em:t,status:force?"Devolvido manualmente pelo administrador":"Devolvido",tempo_total:t-r.retirada_em};
   if(force)u.justificativa={texto:$("#j").value.trim(),em:t,por:me};
   await db.doc("retiradas/"+r.id).update(u);
   await db.doc("coletores/"+c.id).update({status:"Disponível",atualizado_em:t});
   await db.doc("notificacoes/dev-"+r.id).set({tipo:"green",texto:`Coletor ${c.id_plus} devolvido por ${r.colaborador_nome} (${dur(t-r.retirada_em)})`,ts:t,lida:false});
   modal(`<div class="ok"><h2>Coletor devolvido com sucesso e disponível para o próximo colaborador.</h2><p>Tempo total de utilização: <b>${dur(t-r.retirada_em)}</b></p><p class="bn">🔌 Após a devolução, o coletor deve permanecer carregando.</p><button class="btn" onclick="closeM()">OK</button></div>`);
  }catch(e){toast("Erro: "+(e.message||e.code))}
 };
}
function hist(){
 const f=S.f;let rows=[...S.ret].sort((a,b)=>b.retirada_em-a.retirada_em);
 rows=rows.filter(r=>(!f.d||new Date(r.retirada_em).toLocaleDateString("sv")===f.d)&&(!f.n||r.colaborador_nome.toLowerCase().includes(f.n.toLowerCase()))&&(!f.i||r.coletor_id===f.i)&&(!f.s||status(r)===f.s));
 return `<section><h2>Histórico de Utilização</h2><div class="fl"><input type="date" value="${f.d||""}" onchange="S.f.d=this.value;render()"><input placeholder="Colaborador" value="${esc(f.n||"")}" onchange="S.f.n=this.value;render()"><select onchange="S.f.i=this.value;render()"><option value="">Todos os ID Plus</option>${S.col.map(c=>`<option value="${c.id}" ${f.i===c.id?"selected":""}>${esc(c.id_plus)}</option>`).join("")}</select><select onchange="S.f.s=this.value;render()"><option value="">Todos os status</option>${["Devolvido","Em uso","Atrasado","Devolvido manualmente pelo administrador"].map(s=>`<option ${f.s===s?"selected":""}>${s}</option>`).join("")}</select></div>
 <div class="tw"><table><tr><th>Data</th><th>Colaborador</th><th>ID Plus</th><th>Retirada</th><th>Devolução</th><th>Tempo</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${new Date(r.retirada_em).toLocaleDateString("pt-BR")}</td><td>${esc(r.colaborador_nome)}</td><td><img src="${esc(S.col.find(c=>c.id===r.coletor_id)?.foto||IMG)}" width="22" style="vertical-align:middle"> ${esc(cn(r.coletor_id))}</td><td>${hm(r.retirada_em)}</td><td>${r.devolucao_em?hm(r.devolucao_em):"—"}</td><td>${dur(r.tempo_total??el(r))}</td><td>${status(r)}</td></tr>`).join("")||'<tr><td colspan="7">Sem registros.</td></tr>'}</table></div></section>`;
}
function admin(){
 const op=S.ret.filter(r=>!r.devolucao_em),nt=[...S.not].sort((a,b)=>b.ts-a.ts).slice(0,30),un=S.not.filter(n=>!n.lida).length;
 const ic={green:"🟢",yellow:"🟡",red:"🔴",warn:"⚠️"};
 return `<section><h2>🔔 Notificações <span class="badge">${un}</span></h2><button class="btn s o" onclick="readAll()">Marcar todas como lidas</button>${nt.map(n=>`<div class="nt ${n.lida?"":"u"}"><span>${ic[n.tipo]||""} ${esc(n.texto)}<br><small>${dt(n.ts)}</small></span>${n.rid?`<button class="btn s" onclick="msgModal('${n.rid}')">Enviar</button>`:""}</div>`).join("")||'<p class="mu">Sem notificações.</p>'}</section>
 <section><h2>Coletores em uso</h2><button class="btn s y" style="margin-bottom:10px" onclick="msgModal(null,1)">⚙️ AVISO DE CONFIGURAÇÃO (enviar antecipado)</button><div class="tw"><table><tr><th>ID Plus</th><th>Colaborador</th><th>WhatsApp</th><th>Retirada</th><th>Tempo</th><th></th></tr>${op.map(r=>`<tr><td>${esc(cn(r.coletor_id))}</td><td>${esc(r.colaborador_nome)}</td><td>${esc(r.whatsapp)}</td><td>${hm(r.retirada_em)}</td><td>${hms(el(r))}${late(r)?" 🔴":""}</td><td><div class="row"><button class="btn s o" onclick="msgModal('${r.id}')">ENVIAR MENSAGEM</button><button class="btn s y" onclick="just('${r.id}')">Justificar</button><button class="btn s d" onclick="devolver('${r.coletor_id}',1)">Forçar devolução</button></div>${r.justificativa?`<small>Justificativa: ${esc(r.justificativa.texto)} (${dt(r.justificativa.em)}, ${esc(r.justificativa.por)})</small>`:""}</td></tr>`).join("")||'<tr><td colspan="6">Nenhum coletor em uso.</td></tr>'}</table></div></section>
 <section><h2>Coletores cadastrados</h2><div class="row"><button class="btn s" onclick="colForm()">+ Coletor</button><button class="btn s o" onclick="lote()">Cadastrar em lote</button></div><div class="grid" style="margin-top:10px">${S.col.map(c=>`<div class="col ${c.ativo===false?"off":""}" style="cursor:default"><img src="${esc(c.foto||IMG)}"><div class="ci"><b>ID Plus ${esc(c.id_plus)}</b><small>${esc(c.obs||"")}</small><div class="row"><button class="btn s o" onclick="colForm('${c.id}')">Editar</button><button class="btn s o" onclick="toggle('${c.id}')">${c.ativo===false?"Ativar":"Desativar"}</button></div></div></div>`).join("")}</div></section>
 <section><h2>💬 WhatsApp</h2><p class="${waOk()?"":"warn"}">${waOk()?"Integração configurada (provedor oficial)":"WhatsApp não configurado"}</p>
 <label>Provedor / URL da API<input id="ca" value="${esc(S.cfg.api||"")}"></label><label>Número remetente<input id="cr" value="${esc(S.cfg.remetente||REM)}"></label><label>Webhook<input id="cw" value="${esc(S.cfg.webhook||"")}"></label>
 <p class="mu">O token da API não é guardado nesta página: ele deve ficar em um serviço de backend seguro. Sem esse serviço, as mensagens ficam em fila e você as envia pelo botão ENVIAR MENSAGEM (abre o WhatsApp oficial com o texto pronto).</p><button class="btn s" onclick="saveCfg()">Salvar configuração</button></section>`;
}
async function readAll(){for(const n of S.not.filter(n=>!n.lida))await db.doc("notificacoes/"+n.id).update({lida:true})}
async function saveCfg(){await db.doc("config/whatsapp").set({api:$("#ca").value.trim(),remetente:$("#cr").value.trim(),webhook:$("#cw").value.trim()});toast("Configuração salva")}
async function toggle(id){const c=S.col.find(x=>x.id===id);await db.doc("coletores/"+id).update({ativo:c.ativo===false,atualizado_em:Date.now()})}
function just(rid){
 modal(`<h2>Registrar justificativa</h2><label>Motivo<select id="p"><option>Coletor ainda está sendo utilizado em processo operacional.</option><option>Problema técnico.</option><option>Necessidade operacional.</option><option value="">Outro</option></select></label><label>Texto livre (opcional)<textarea id="x" rows="3"></textarea></label><button class="btn" style="width:100%" id="ok">SALVAR</button>`);
 $("#ok").onclick=async()=>{const tx=($("#p").value+" "+$("#x").value).trim();if(!tx)return toast("Informe a justificativa");
  await db.doc("retiradas/"+rid).update({justificativa:{texto:tx,em:Date.now(),por:me}});closeM();toast("Justificativa registrada")}
}
function msgModal(rid,tpl){
 const op=S.ret.filter(r=>!r.devolucao_em);if(!op.length)return toast("Nenhuma retirada ativa");
 const p=op.find(r=>r.id===rid)?rid:op[0].id;
 const def=()=>{const r=S.ret.find(x=>x.id===$("#s").value),i=cn(r.coletor_id);$("#tx").value=$("#tp").value==="3"?`Caro usuário, já se passaram mais de 2 horas que o coletor ID Plus ${i}, retirado em seu nome, consta como em uso e não foi devolvido. Caso já tenha finalizado os processos na seção, devolva-o imediatamente e não o deixe parado no setor, pois outros colaboradores necessitam utilizá-lo e ele precisa estar carregado.\n\nConto com a sua compreensão.\n\nAtenciosamente,\nEquipe ADM Cerro Corá`:$("#tp").value==="2"?`Caro usuário, você ainda está usando o coletor ID Plus ${i}? Caso não, favor devolver, pois outro colaborador está necessitando dele para realizar os processos do setor.`:$("#tp").value==="1"?`O Coletor ID Plus ${i} precisa de configuração. Favor devolver imediatamente. Caso não seja atualizado na data de hoje, haverá impacto nos processos e será necessária a abertura de chamado para retirada do equipamento, que pode ficar fora da loja por mais de 2 semanas.`:`O Coletor ID Plus ${i} ainda consta como não devolvido. Por favor, verifique a devolução assim que possível para que outros colaboradores possam utilizá-lo.`;$("#tx").value=$("#tp").value?r.colaborador_nome+": "+$("#tx").value:""};
 modal(`<h2>Enviar mensagem</h2><label>Modelo<select id="tp"><option value="">▼ Selecione o motivo do acionamento</option><option value="0">Devolução pendente</option><option value="1">⚙️ Coletor precisa de configuração – devolver agora</option><option value="2">❓ Você ainda está usando o coletor?</option><option value="3">⏱️ Mais de 2h sem devolução</option></select></label><label>Retirada ativa<select id="s">${op.map(r=>`<option value="${r.id}" ${r.id===p?"selected":""}>${esc(cn(r.coletor_id))} – ${esc(r.colaborador_nome)}</option>`).join("")}</select></label><label>Mensagem (editável)<textarea id="tx" rows="7" placeholder="Selecione o motivo do acionamento acima"></textarea></label><p class="bn">📱 Remetente: ${REM}. Envie com o WhatsApp deste número conectado no aparelho.</p><button class="btn" style="width:100%" id="ok">ENVIAR MENSAGEM</button>`);
 $("#tp").value=tpl?"1":"";def();$("#s").onchange=def;$("#tp").onchange=def;
 $("#ok").onclick=async()=>{const r=S.ret.find(x=>x.id===$("#s").value),t=Date.now();let tx=$("#tx").value.trim();if(!$("#tp").value||!tx)return toast("Selecione o motivo do acionamento");if(!tx.startsWith(r.colaborador_nome+":"))tx=r.colaborador_nome+": "+tx;
  const ph="55"+r.whatsapp.replace(/\D/g,""),q=encodeURIComponent(tx);try{window.open("https://wa.me/"+ph+"?text="+q,"_blank")}catch(e){}
  await db.doc("mensagens/m"+t).set({retirada_id:r.id,telefone:r.whatsapp,mensagem:tx,remetente:REM,tipo:$("#tp").value==="1"?"aviso de configuração":$("#tp").value==="3"?"aviso de atraso (2h)":$("#tp").value==="2"?"verificação de uso":"manual",status_envio:"aberto no WhatsApp pelo administrador",enviada_em:t,erro:null,por:me});
  window.WA_TX=tx;modal(`<div class="ok"><h2>Mensagem pronta</h2><p>Se o WhatsApp Business não abriu sozinho, toque em uma das opções:</p><a class="btn" style="display:block;text-decoration:none;text-align:center;margin:8px 0" href="https://wa.me/${ph}?text=${q}" target="_blank" rel="noopener">📱 Abrir WhatsApp</a><a class="btn y" style="display:block;text-decoration:none;text-align:center;margin:8px 0" href="whatsapp://send?phone=${ph}&text=${q}">Abrir direto no aplicativo</a><button class="btn o" style="width:100%;margin:8px 0" onclick="navigator.clipboard.writeText(WA_TX).then(()=>toast('Mensagem copiada'),()=>toast('Não foi possível copiar'))">Copiar mensagem</button><p class="mu">Para: ${esc(r.whatsapp)}</p><button class="btn s o" onclick="closeM()">Fechar</button></div>`)}
}
function colForm(id){
 const c=S.col.find(x=>x.id===id)||{};let foto=c.foto||"";
 modal(`<h2>${id?"Editar":"Novo"} coletor</h2><div class="pv"><img id="pi" src="${esc(foto||IMG)}"></div><label>ID Plus<input id="a" value="${esc(c.id_plus||"")}"></label><label>Número interno<input id="b" value="${esc(c.interno||"")}"></label><label>Observações<textarea id="o" rows="2">${esc(c.obs||"")}</textarea></label><label>Foto (opcional)<input type="file" id="f" accept="image/*"></label><button class="btn" style="width:100%" id="ok">SALVAR</button>`);
 $("#f").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);foto=cv.toDataURL("image/jpeg",.8);$("#pi").src=foto};im.src=URL.createObjectURL(fl)};
 $("#ok").onclick=async()=>{const ip=$("#a").value.trim();if(!ip)return toast("Informe o ID Plus");
  if(S.col.some(x=>x.id!==id&&x.id_plus===ip))return toast("ID Plus já cadastrado");
  const t=Date.now(),k=id||"c"+t;
  await db.doc("coletores/"+k).set({id_plus:ip,interno:$("#b").value.trim(),obs:$("#o").value.trim(),foto,status:c.status||"Disponível",ativo:c.ativo!==false,criado_em:c.criado_em||t,atualizado_em:t});closeM()}
}
function lote(){
 modal(`<h2>Cadastrar em lote</h2><label>ID Plus separados por vírgula ou linha<textarea id="l" rows="4" placeholder="ID-01, ID-02, ID-03"></textarea></label><button class="btn" style="width:100%" id="ok">CADASTRAR</button>`);
 $("#ok").onclick=async()=>{const ids=[...new Set($("#l").value.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean))].filter(i=>!S.col.some(c=>c.id_plus===i));let t=Date.now();
  for(const i of ids){await db.doc("coletores/c"+(++t)).set({id_plus:i,interno:"",obs:"",foto:"",status:"Disponível",ativo:true,criado_em:t,atualizado_em:t})}closeM();toast(ids.length+" coletor(es) cadastrado(s)")}
}
async function check(){
 for(const r of S.ret){if(r.devolucao_em)continue;const e=el(r),id=cn(r.coletor_id),t=Date.now();
  try{
  if(e>LIM&&!done.has("a"+r.id)&&!S.not.some(n=>n.id==="atraso-"+r.id)){done.add("a"+r.id);
   await db.doc("retiradas/"+r.id).update({status:"Atrasado"});
   await db.doc("notificacoes/atraso-"+r.id).set({tipo:"red",texto:`Coletor ${id} ultrapassou 2 horas (${r.colaborador_nome})`,ts:t,lida:false});
   await db.doc("mensagens/auto-"+r.id).set({retirada_id:r.id,telefone:r.whatsapp,mensagem:msgAuto(id),tipo:"automática",status_envio:waOk()?"fila":"pendente – WhatsApp não configurado",enviada_em:null,erro:waOk()?null:"Integração não configurada"});
   if(!waOk())await db.doc("notificacoes/wa-"+r.id).set({tipo:"warn",texto:`WhatsApp não enviado para ${r.colaborador_name||r.colaborador_nome} (coletor ${id}). Use Enviar.`,ts:t,lida:false,rid:r.id});
  }else if(e>WARN&&e<=LIM&&!done.has("p"+r.id)&&!S.not.some(n=>n.id==="prox-"+r.id)){done.add("p"+r.id);
   await db.doc("notificacoes/prox-"+r.id).set({tipo:"yellow",texto:`Coletor ${id} próximo de completar 2 horas`,ts:t,lida:false})}
  }catch(x){}
 }
}
(async()=>{
 render();
 try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
 isAdmin=!!(user&&user.canEdit());
 try{const m=await user.me();me=m?.name||"Usuário"}catch(e){}
 if(!db)return render();
 const sub=(n,k)=>db.collection(n).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast("Erro de dados"));
 sub("coletores","col");sub("retiradas","ret");sub("notificacoes","not");sub("mensagens","msg");
 db.doc("config/whatsapp").onSnapshot(s=>{S.cfg=s.data()||{};render()});
 setInterval(()=>{if(!$("#m").classList.contains("on")&&S.tab!=="hist"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA")render()},1000);
 setInterval(check,15000);
})();
</script></body></html>
